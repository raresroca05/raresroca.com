<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Rares Roca</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <style>
    .lost {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 16px;
    }
    .lost-code {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .lost h1 { margin: 0 auto; }
    .lost p { color: var(--muted); margin: 18px auto 32px; max-width: 40ch; }
    .lost .btn { display: inline-flex; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <p class="lost-code">404 · off the racing line</p>
      <h1>This page took a <em>wrong turn</em>.</h1>
      <p>The page you're looking for isn't here. Let's get you back on track.</p>
      <a class="btn btn-primary" href="/">Back to the homepage</a>
    </div>
  </main>
</body>
</html>
